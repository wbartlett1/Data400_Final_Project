name: Collect Flight Data

on:
  schedule:
    # Runs at 12:00 AM UTC (0:00)
    - cron: '0 0 * * *'
    # Runs at 12:00 PM UTC (12:00)
    - cron: '0 12 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: write  # Important: allows the workflow to push changes

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run flight data collection
      run: |
        python collect_flights.py
    
    - name: Commit and push data
      run: |
        git config --local user.name "GitHub Action"
        git config --local user.email "action@github.com"
        git add data/*.csv
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No new data to commit"
        else
          git commit -m "Add flight data from $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
          echo "Data committed and pushed successfully"
        fi
