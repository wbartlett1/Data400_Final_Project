name: Collect Flight Data

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run flight data collection and upload to Dropbox
      env:
        DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      run: |
        python collect_flights.py
    
    # NEW: Save data as artifact even if Dropbox fails
    - name: Upload data as artifact (backup)
      if: always()  # This runs even if previous steps fail
      uses: actions/upload-artifact@v4
      with:
        name: flight-data-${{ github.run_number }}
        path: data/*.csv
        retention-days: 90
    
    - name: Cleanup local files
      run: |
        rm -rf data/
        echo "Local files cleaned up"
